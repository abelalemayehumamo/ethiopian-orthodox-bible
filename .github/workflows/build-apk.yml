name: Build Debug APK

# Runs automatically whenever any .zip file at the repo root changes on the
# main branch, and can also be triggered manually from the Actions tab
# ("Run workflow" button). Deliberately filename-agnostic (matches *.zip
# rather than one exact name) so re-uploading a corrected zip under a new
# name always triggers a fresh build instead of silently reusing a stale
# cached file with the old name.
on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        # Picks up whatever single .zip file is at the repo root, regardless
        # of its name — avoids any dependency on a specific filename.
        run: |
          ZIPFILE=$(ls *.zip | head -n1)
          echo "Using zip: $ZIPFILE"
          unzip -q "$ZIPFILE"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        working-directory: ethiopian-orthodox-bible
        # --legacy-peer-deps: some React Navigation / RN peer-dependency
        # ranges are stricter than npm's default resolver likes. This is the
        # documented, supported escape hatch, not a hack — see docs/TROUBLESHOOTING.md.
        run: npm install --legacy-peer-deps

      - name: Build empty (schema-only) Bible database asset
        working-directory: ethiopian-orthodox-bible
        # No verified Bible text is bundled yet (see docs/BIBLE_DATA.md).
        # This produces a valid bible.db with all books listed and zero
        # verses, so the app boots and shows its designed Amharic
        # empty-state screens instead of crashing on a missing asset.
        run: |
          mkdir -p data/raw android/app/src/main/assets
          echo "[]" > data/raw/empty.json
          npx ts-node --skip-project -O '{"module":"commonjs","target":"es2019","esModuleInterop":true,"resolveJsonModule":true,"skipLibCheck":true,"strict":false}' scripts/build-database/index.ts --input data/raw/empty.json --out android/app/src/main/assets/bible.db

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: ethiopian-orthodox-bible/android
        # Uses the `gradle` command directly (from setup-gradle above)
        # instead of ./gradlew, because this scaffold does not ship a
        # pre-built gradle-wrapper.jar — see docs/TROUBLESHOOTING.md.
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ethiopian-orthodox-bible-debug-apk
          path: ethiopian-orthodox-bible/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error